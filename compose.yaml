services:
  postgres_main:
    image: postgres:18
    container_name: postgres_main
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_MAIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_main_data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: временный сервер initdb слушает только unix-сокет,
      # поэтому проверка по TCP не даёт ложного "готов".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      - data_stack

  postgres_ml:
    image: postgres:18
    container_name: postgres_ml
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ML_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ML_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres_ml_data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: временный сервер initdb слушает только unix-сокет,
      # поэтому проверка по TCP не даёт ложного "готов".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      - data_stack

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./data/clickhouse_data:/var/lib/clickhouse
      - ./data/clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      - data_stack

  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks:
      - data_stack

  redis:
    image: redis:7-alpine
    container_name: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping 2>/dev/null | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      - data_stack

networks:
  data_stack:
    driver: bridge
